<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Lidl Font Cond Pro", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 14px; color: #1e293b; font-size: 13px; }
    .msg { color: #94a3b8; font-size: 12px; }
    .err { color: #dc2626; font-weight: 700; }

    .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .who { font-weight: 800; }
    .nav { display: flex; align-items: center; gap: 8px; }
    .nav button { border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 800; }
    .period { font-weight: 900; min-width: 140px; text-align: center; }

    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .dow { text-align: center; font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; padding: 2px 0; }
    .cell { min-height: 54px; border: 1px solid #e2e8f0; border-radius: 7px; padding: 3px; cursor: pointer; background: #fff; }
    .cell:hover { border-color: #94a3b8; }
    .cell.wknd { background: #f1f5f9; }
    .cell.blank { visibility: hidden; }
    .cell.nodesk { border-color: #ef4444; border-width: 2px; }
    .cell .num { font-size: 10px; color: #64748b; font-weight: 700; }
    .cell .dlbl { font-size: 9px; color: #0369a1; font-weight: 800; margin-top: 2px; }
    .chip { margin-top: 3px; border-radius: 5px; font-weight: 900; font-size: 12px; text-align: center; padding: 6px 2px; }
    .halves { display: flex; gap: 2px; margin-top: 3px; }
    .halves .h { flex: 1; border-radius: 4px; font-weight: 900; font-size: 10px; text-align: center; padding: 6px 1px; min-height: 16px; background: #f1f5f9; }

    .foot { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .sum { font-weight: 800; }
    .btn { border: none; border-radius: 7px; padding: 8px 18px; font-weight: 800; cursor: pointer; }
    .btn.primary { background: #004fac; color: #fff; }
    .btn.ghost { background: #f1f5f9; color: #334155; }
    .btn.danger { background: #fee2e2; color: #b91c1c; }

    .pick { position: fixed; inset: 0; background: rgba(15, 23, 42, .4); display: none; align-items: center; justify-content: center; }
    .pick.on { display: flex; }
    .pcard { background: #fff; border-radius: 12px; padding: 16px; width: min(600px, 94vw); max-height: 90vh; overflow: auto; }
    .ptitle { font-weight: 900; font-size: 15px; margin-bottom: 10px; }
    .mode { display: flex; margin-bottom: 12px; }
    .mode button { flex: 1; border: 1.5px solid #cbd5e1; background: #f8fafc; padding: 8px; font-weight: 800; cursor: pointer; }
    .mode button:first-child { border-radius: 8px 0 0 8px; }
    .mode button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
    .mode button.act { background: #004fac; color: #fff; border-color: #004fac; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
    .tile { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; }
    .tile.sel { outline: 3px solid #004fac; }
    .tile .ab { display: inline-block; min-width: 28px; padding: 4px 6px; border-radius: 6px; font-weight: 900; }
    .tile .nm { font-size: 9px; color: #475569; margin-top: 4px; display: block; line-height: 1.15; }
    .tile.none .ab { background: #e2e8f0; color: #475569; }
    .hsec { margin-bottom: 10px; }
    .hsec .lbl { font-weight: 800; font-size: 11px; text-transform: uppercase; color: #64748b; margin-bottom: 5px; }
    .pact { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 8px; }
    .rng { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .rng label { font-weight: 700; font-size: 12px; }
    .rng input[type=number] { width: 58px; padding: 5px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    .rng .chk { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"><div class="msg">Načítám…</div></div>

  <div class="pick" id="pick">
    <div class="pcard">
      <div class="ptitle" id="ptitle"></div>
      <div class="mode">
        <button id="mFull" onclick="setMode('FULL')">CELÝ DEN</button>
        <button id="mHalf" onclick="setMode('HALF')">½ DEN</button>
      </div>
      <div id="pFull"><div class="tiles" id="tilesFull"></div></div>
      <div id="pHalf" style="display:none">
        <div class="hsec"><div class="lbl">Dopoledne</div><div class="tiles" id="tilesDop"></div></div>
        <div class="hsec"><div class="lbl">Odpoledne</div><div class="tiles" id="tilesOdp"></div></div>
      </div>
      <div id="deskRow" style="display:none;margin-top:10px">
        <button class="btn ghost" style="width:100%" onclick="openDesk(S.den)">🪑 Stůl: <span id="deskCur"></span></button>
      </div>
      <div class="pact">
        <button class="btn danger" onclick="applyClear()">Vymazat den</button>
        <div>
          <button class="btn ghost" onclick="closePick()">Zavřít</button>
          <button class="btn primary" id="btnHalf" style="display:none" onclick="applyHalf()">Uložit půlden</button>
        </div>
      </div>
      <div class="msg" id="perr" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="pick" id="bulk">
    <div class="pcard">
      <div class="ptitle">Hromadné zadání</div>
      <div class="rng">
        <label>Od dne <input type="number" id="bOd" min="1" max="31" value="1"></label>
        <label>do dne <input type="number" id="bDo" min="1" max="31" value="31"></label>
        <label class="chk"><input type="checkbox" id="bVsedni" checked> jen všední dny</label>
      </div>
      <div class="mode">
        <button id="bmFull" onclick="bSetMode('FULL')">CELÝ DEN</button>
        <button id="bmHalf" onclick="bSetMode('HALF')">½ DEN</button>
      </div>
      <div id="bpFull"><div class="tiles" id="bTilesFull"></div></div>
      <div id="bpHalf" style="display:none">
        <div class="hsec"><div class="lbl">Dopoledne</div><div class="tiles" id="bTilesDop"></div></div>
        <div class="hsec"><div class="lbl">Odpoledne</div><div class="tiles" id="bTilesOdp"></div></div>
      </div>
      <div class="pact">
        <button class="btn danger" onclick="bClear()">Vymazat v rozsahu</button>
        <div>
          <button class="btn ghost" onclick="closeBulk()">Zavřít</button>
          <button class="btn primary" onclick="bApply()">Použít</button>
        </div>
      </div>
      <div class="msg" id="berr" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="pick" id="desk">
    <div class="pcard">
      <div class="ptitle" id="dtitle"></div>
      <div class="tiles" id="deskTiles"></div>
      <div class="pact">
        <button class="btn danger" onclick="deskSend('')">Bez stolu</button>
        <button class="btn ghost" onclick="closeDesk()">Zavřít</button>
      </div>
      <div class="msg" id="derr" style="margin-top:8px"></div>
    </div>
  </div>

  <script>
    var S = { init: null, mesic: null, rok: null, dny: [], souhrn: 0, den: null, mode: 'FULL', dopSel: '', odpSel: '',
      bMode: 'FULL', bDop: '', bOdp: '', rezMesic: [], deskDen: null };
    var MES = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];
    var DOW = ['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'];

    google.script.run.withSuccessHandler(onInit).withFailureHandler(fatal).dm_init();

    function fatal(e) {
      document.getElementById('app').innerHTML = '<div class="err">' + esc(e && e.message ? e.message : e) + '</div>';
    }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function onInit(d) { S.init = d; S.init.userId = String(d.userId); S.mesic = d.mesic; S.rok = d.rok; loadMonth(); }

    function loadMonth() {
      document.getElementById('app').innerHTML = '<div class="msg">Načítám měsíc…</div>';
      google.script.run.withSuccessHandler(onMonth).withFailureHandler(fatal)
        .dm_mesic({ userId: S.init.userId, mesic: S.mesic });
    }
    function onMonth(m) { S.dny = m.dny; S.souhrn = m.souhrn; S.rezMesic = m.rezMesic || []; render(); }

    function mojeRez(den) {
      var r = S.rezMesic.filter(function (x) { return x.uid === S.init.userId && x.den === den; })[0];
      return r ? r.stul : '';
    }
    function maTrvalyStul() {
      return (S.init.stoly || []).some(function (s) { return (s.trvale || '') === S.init.jmeno; });
    }
    function needsDesk(day) {
      var da = S.init.deskAbbr || [];
      if (!day || maTrvalyStul()) return false;
      if (day.full) return da.indexOf(day.dop) !== -1;
      return da.indexOf(day.dop) !== -1 || da.indexOf(day.odp) !== -1;
    }

    function st(ab) { var a = S.init.statusy.filter(function (x) { return x.abbr === ab; }); return a.length ? a[0] : null; }

    function render() {
      var h = '';
      h += '<div class="hdr"><div class="who">' + esc(S.init.jmeno) + ' &middot; ' + esc(S.init.usek) + '</div>'
        + '<div class="nav"><button onclick="chgMonth(-1)">&#9664;</button>'
        + '<span class="period">' + MES[S.mesic - 1].toUpperCase() + ' ' + S.rok + '</span>'
        + '<button onclick="chgMonth(1)">&#9654;</button></div></div>';
      h += '<div class="grid">';
      DOW.forEach(function (x) { h += '<div class="dow">' + x + '</div>'; });
      var lead = (S.dny[0].dow + 6) % 7;
      for (var i = 0; i < lead; i++) h += '<div class="cell blank"></div>';
      S.dny.forEach(function (day) {
        var mr = mojeRez(day.den);
        var cls = (day.weekend ? ' wknd' : '') + (needsDesk(day) && !mr ? ' nodesk' : '');
        h += '<div class="cell' + cls + '" onclick="openPick(' + day.den + ')">';
        h += '<div class="num">' + day.den + '</div>';
        if (day.full) { if (day.dop) h += chip(day.dop); }
        else { h += '<div class="halves">' + half(day.dop) + half(day.odp) + '</div>'; }
        if (mr) h += '<div class="dlbl">🪑 ' + esc(mr) + '</div>';
        h += '</div>';
      });
      h += '</div>';
      h += '<div class="foot"><span class="sum">Dovolená: ' + (S.souhrn || 0) + ' dní</span>'
        + '<div style="display:flex;gap:8px"><button class="btn ghost" onclick="openBulk()">Hromadně</button>'
        + '<button class="btn primary" onclick="google.script.host.close()">Hotovo</button></div></div>';
      document.getElementById('app').innerHTML = h;
    }

    function chip(ab) { var s = st(ab); return '<div class="chip" style="background:' + (s ? s.color : '#e2e8f0') + ';color:' + (s ? s.fg : '#000') + '">' + esc(ab) + '</div>'; }
    function half(ab) { if (!ab) return '<div class="h"></div>'; var s = st(ab); return '<div class="h" style="background:' + (s ? s.color : '#e2e8f0') + ';color:' + (s ? s.fg : '#000') + '">' + esc(ab) + '</div>'; }

    function chgMonth(delta) { var m = S.mesic + delta; if (m < 1 || m > 12) return; S.mesic = m; loadMonth(); }

    // ── picker ──
    function openPick(den) {
      S.den = den;
      var day = S.dny.filter(function (x) { return x.den === den; })[0];
      S.mode = day.full ? 'FULL' : 'HALF';
      S.dopSel = day.dop || '';
      S.odpSel = day.odp || '';
      document.getElementById('ptitle').textContent = den + '. ' + MES[S.mesic - 1] + ' ' + S.rok;
      document.getElementById('perr').textContent = '';
      buildTiles();
      setMode(S.mode);
      updateDeskRow();
      document.getElementById('pick').classList.add('on');
    }
    function closePick() { document.getElementById('pick').classList.remove('on'); }

    function updateDeskRow() {
      var da = S.init.deskAbbr || [];
      var wd = S.mode === 'FULL' ? da.indexOf(S.dopSel) !== -1
        : (da.indexOf(S.dopSel) !== -1 || da.indexOf(S.odpSel) !== -1);
      document.getElementById('deskRow').style.display = wd ? '' : 'none';
      document.getElementById('deskCur').textContent = mojeRez(S.den) || 'vybrat';
    }

    // ── výběr stolu ──
    function openDesk(den) {
      S.deskDen = den;
      document.getElementById('dtitle').textContent = 'Stůl — ' + den + '. ' + MES[S.mesic - 1] + ' ' + S.rok;
      document.getElementById('derr').textContent = '';
      var html = (S.init.stoly || []).map(function (d) {
        var b = S.rezMesic.filter(function (r) { return r.den === den && r.stul === d.label; })[0];
        var stav, kdo = '', klik = '', cls = '';
        if (b) {
          if (b.uid === S.init.userId) { stav = 'tvůj'; klik = "deskSend('" + d.label + "')"; cls = ' sel'; }
          else { stav = 'obsazený'; kdo = b.jmeno; }
        } else if (d.trvale && d.trvale !== S.init.jmeno) {
          stav = 'trvalý'; kdo = d.trvale;
        } else {
          stav = 'volný'; klik = "deskSend('" + d.label + "')";
        }
        return '<div class="tile' + cls + (klik ? '' : ' none') + '" '
          + (klik ? 'onclick="' + klik + '"' : 'style="opacity:.55;cursor:default"') + '>'
          + '<span class="ab" style="background:#e2e8f0;color:#334155">' + esc(d.label) + '</span>'
          + '<span class="nm">' + stav + (kdo ? '<br>' + esc(kdo) : '') + '</span></div>';
      }).join('');
      document.getElementById('deskTiles').innerHTML = html || '<div class="msg">Žádné stoly.</div>';
      closePick();
      document.getElementById('desk').classList.add('on');
    }
    function closeDesk() { document.getElementById('desk').classList.remove('on'); }
    function deskSend(stul) {
      document.getElementById('derr').textContent = 'Ukládám…';
      google.script.run
        .withSuccessHandler(function (res) { S.rezMesic = res.rezMesic; closeDesk(); render(); })
        .withFailureHandler(function (e) {
          document.getElementById('derr').innerHTML = '<span class="err">' + esc(e && e.message ? e.message : e) + '</span>';
        })
        .dm_stul({ userId: S.init.userId, jmeno: S.init.jmeno, mesic: S.mesic, den: S.deskDen, stul: stul, deskAbbr: S.init.deskAbbr });
    }

    function tileHtml(s, sel, expr) {
      return '<div class="tile' + (sel ? ' sel' : '') + '" onclick="' + expr + '">'
        + '<span class="ab" style="background:' + s.color + ';color:' + s.fg + '">' + esc(s.abbr) + '</span>'
        + '<span class="nm">' + esc(s.name) + '</span></div>';
    }
    function noneHtml(sel, expr) {
      return '<div class="tile none' + (sel ? ' sel' : '') + '" onclick="' + expr + '">'
        + '<span class="ab">&mdash;</span><span class="nm">práce / nic</span></div>';
    }
    function buildTiles() {
      document.getElementById('tilesFull').innerHTML =
        S.init.statusy.map(function (s) { return tileHtml(s, false, "applyFull('" + s.abbr + "')"); }).join('');
      document.getElementById('tilesDop').innerHTML =
        noneHtml(S.dopSel === '', "selHalf('dop','')") +
        S.init.statusy.map(function (s) { return tileHtml(s, S.dopSel === s.abbr, "selHalf('dop','" + s.abbr + "')"); }).join('');
      document.getElementById('tilesOdp').innerHTML =
        noneHtml(S.odpSel === '', "selHalf('odp','')") +
        S.init.statusy.map(function (s) { return tileHtml(s, S.odpSel === s.abbr, "selHalf('odp','" + s.abbr + "')"); }).join('');
    }

    function setMode(m) {
      S.mode = m;
      document.getElementById('mFull').classList.toggle('act', m === 'FULL');
      document.getElementById('mHalf').classList.toggle('act', m === 'HALF');
      document.getElementById('pFull').style.display = m === 'FULL' ? '' : 'none';
      document.getElementById('pHalf').style.display = m === 'HALF' ? '' : 'none';
      document.getElementById('btnHalf').style.display = m === 'HALF' ? '' : 'none';
      updateDeskRow();
    }
    function selHalf(which, ab) { if (which === 'dop') S.dopSel = ab; else S.odpSel = ab; buildTiles(); updateDeskRow(); }

    function applyFull(ab) { send('FULL', ab, '', (S.init.deskAbbr || []).indexOf(ab) !== -1); }
    function applyHalf() {
      var da = S.init.deskAbbr || [];
      send('HALF', S.dopSel, S.odpSel, da.indexOf(S.dopSel) !== -1 || da.indexOf(S.odpSel) !== -1);
    }
    function applyClear() { send('CLEAR', '', '', false); }

    function send(rezim, dop, odp, thenDesk) {
      document.getElementById('perr').textContent = 'Ukládám…';
      google.script.run
        .withSuccessHandler(function (res) {
          for (var i = 0; i < S.dny.length; i++) if (S.dny[i].den === res.den.den) S.dny[i] = res.den;
          S.souhrn = res.souhrn;
          if (thenDesk && !mojeRez(S.den)) { render(); openDesk(S.den); }
          else { closePick(); render(); }
        })
        .withFailureHandler(function (e) {
          document.getElementById('perr').innerHTML = '<span class="err">' + esc(e && e.message ? e.message : e) + '</span>';
        })
        .dm_uloz({ userId: S.init.userId, jmeno: S.init.jmeno, mesic: S.mesic, den: S.den, rezim: rezim, dop: dop, odp: odp, vacAbbr: S.init.vacAbbr, deskAbbr: S.init.deskAbbr });
    }

    // ── hromadné zadání ──
    function openBulk() {
      S.bMode = 'FULL'; S.bDop = ''; S.bOdp = '';
      var dvm = S.dny.length;
      document.getElementById('bDo').max = dvm;
      document.getElementById('bOd').max = dvm;
      if (Number(document.getElementById('bDo').value) > dvm) document.getElementById('bDo').value = dvm;
      document.getElementById('berr').textContent = '';
      bBuildTiles();
      bSetMode('FULL');
      document.getElementById('bulk').classList.add('on');
    }
    function closeBulk() { document.getElementById('bulk').classList.remove('on'); }
    function bSetMode(m) {
      S.bMode = m;
      document.getElementById('bmFull').classList.toggle('act', m === 'FULL');
      document.getElementById('bmHalf').classList.toggle('act', m === 'HALF');
      document.getElementById('bpFull').style.display = m === 'FULL' ? '' : 'none';
      document.getElementById('bpHalf').style.display = m === 'HALF' ? '' : 'none';
    }
    function bBuildTiles() {
      document.getElementById('bTilesFull').innerHTML =
        S.init.statusy.map(function (s) { return tileHtml(s, S.bDop === s.abbr && S.bMode === 'FULL', "bSelFull('" + s.abbr + "')"); }).join('');
      document.getElementById('bTilesDop').innerHTML =
        noneHtml(S.bDop === '', "bSelHalf('dop','')") +
        S.init.statusy.map(function (s) { return tileHtml(s, S.bDop === s.abbr, "bSelHalf('dop','" + s.abbr + "')"); }).join('');
      document.getElementById('bTilesOdp').innerHTML =
        noneHtml(S.bOdp === '', "bSelHalf('odp','')") +
        S.init.statusy.map(function (s) { return tileHtml(s, S.bOdp === s.abbr, "bSelHalf('odp','" + s.abbr + "')"); }).join('');
    }
    function bSelFull(ab) { S.bDop = ab; S.bOdp = ''; bBuildTiles(); }
    function bSelHalf(which, ab) { if (which === 'dop') S.bDop = ab; else S.bOdp = ab; bBuildTiles(); }
    function bClear() { bSend('CLEAR', '', ''); }
    function bApply() {
      if (S.bMode === 'FULL') {
        if (!S.bDop) { document.getElementById('berr').innerHTML = '<span class="err">Vyber status.</span>'; return; }
        bSend('FULL', S.bDop, '');
      } else {
        bSend('HALF', S.bDop, S.bOdp);
      }
    }
    function bSend(rezim, dop, odp) {
      var od = Number(document.getElementById('bOd').value) || 1;
      var doo = Number(document.getElementById('bDo').value) || S.dny.length;
      document.getElementById('berr').textContent = 'Ukládám…';
      google.script.run
        .withSuccessHandler(function (res) {
          S.dny = res.dny; S.souhrn = res.souhrn;
          closeBulk();
          render();
        })
        .withFailureHandler(function (e) {
          document.getElementById('berr').innerHTML = '<span class="err">' + esc(e && e.message ? e.message : e) + '</span>';
        })
        .dm_hromadne({
          userId: S.init.userId, jmeno: S.init.jmeno, mesic: S.mesic, odDen: od, doDen: doo,
          jenVsedni: document.getElementById('bVsedni').checked,
          rezim: rezim, dop: dop, odp: odp, vacAbbr: S.init.vacAbbr, deskAbbr: S.init.deskAbbr
        });
    }
  </script>
</body>
</html>
